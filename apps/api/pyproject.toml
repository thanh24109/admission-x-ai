[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "admission-x-api"
version = "0.1.0"
description = "FastAPI backend for Admission X AI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "langgraph>=0.2,<1",
  "langchain-core>=0.3,<1",
  "httpx>=0.27,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29.0",
  "beautifulsoup4>=4.12,<5",
  "pyyaml>=6.0,<7",
  "python-docx>=1.1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
eval = [
  "pytest-agentharness[langgraph]==0.1.0a2",
  "PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["ai/prompts/*.md", "ai/prompts/modules/*.md", "py.typed"]

[tool.pytest.ini_options]
pythonpath = [".", "../.."]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py311"
