name: backend-ci
on:
  push:
    paths: ["apps/api/**", "ai/**", "evals/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["apps/api/**", "ai/**", "evals/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "apps/api[dev]"
      - run: pytest apps/api/tests evals/harness/tests
