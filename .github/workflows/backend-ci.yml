name: backend-ci
on:
  push:
    paths: ["apps/api/**", "evals/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["apps/api/**", "evals/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "apps/api[dev,eval]"
      - name: Code style and linting
        run: ruff check apps/api evals
      - name: Unit and regression test suite
        run: pytest apps/api/tests evals/harness/tests -q
      - name: Deterministic golden dataset evaluation harness
        run: python -m evals.harness.runner --dataset evals/datasets/golden_admission_v1.jsonl --mode all --strict --output evals/reports/ci/golden
        env:
          PYTHONPATH: apps/api:.
      - name: Synthetic response & citation contract evaluation harness
        run: python -m evals.harness.runner --dataset evals/datasets/synthetic_contracts_v1.jsonl --mode contract --strict --output evals/reports/ci/contracts
        env:
          PYTHONPATH: apps/api:.
      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-5-evaluation-reports
          path: evals/reports/ci/

